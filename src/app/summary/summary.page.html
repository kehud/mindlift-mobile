<ion-content [fullscreen]="true" class="summary-content">
  <main class="summary-shell" *ngIf="session as workout">
    <section class="summary-hero" aria-labelledby="summary-title">
      <div class="completion-mark" aria-hidden="true">
        <ion-icon name="checkmark"></ion-icon>
      </div>
      <h1 id="summary-title">Workout Complete!</h1>
      <p>You showed up for yourself.</p>
    </section>

    <section class="summary-stats" aria-label="Workout summary">
      <div class="summary-stat">
        <span>Duration</span>
        <strong>{{ workout.durationMinutes }}:00</strong>
      </div>
      <div class="summary-stat">
        <span>Reps Used</span>
        <strong>3</strong>
      </div>
      <div class="summary-stat">
        <span>Focus Score</span>
        <strong>87%</strong>
      </div>
    </section>

    <section class="summary-actions" aria-label="Summary actions">
      <p class="summary-note">Great work. Keep building.</p>

      <ion-button class="summary-done" expand="block" (click)="done()">
        Done
      </ion-button>

      <button class="summary-share" type="button" disabled aria-label="Sharing is unavailable">
        <ion-icon name="share-outline" aria-hidden="true"></ion-icon>
        <span>Share</span>
      </button>
    </section>
  </main>
</ion-content>
