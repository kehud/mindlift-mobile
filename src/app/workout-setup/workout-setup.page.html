<ion-header [translucent]="true">
  <ion-toolbar class="setup-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>NEW WORKOUT</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="setup-content">
  <main class="setup-shell">
    <section class="setup-intro" aria-labelledby="setup-title">
      <p class="eyebrow">MAKE IT YOURS</p>
      <h1 id="setup-title">Set up your workout.</h1>
      <p>A few small choices help us guide the session.</p>
    </section>

    <section class="setup-form" aria-label="Workout preferences">
      <button
        type="button"
        class="setup-selector-row"
        [class.is-expanded]="activeSelector === 'workoutType'"
        [attr.aria-expanded]="activeSelector === 'workoutType'"
        aria-controls="workout-type-options"
        (click)="toggleSelector('workoutType')"
      >
        <span class="setup-option__icon" aria-hidden="true">
          <ion-icon name="barbell-outline"></ion-icon>
        </span>
        <span class="setup-selector-copy">
          <span>Focus area</span>
          <strong>{{ workoutTypeLabel }}</strong>
        </span>
        <ion-icon class="setup-selector-chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
      </button>

      <ion-radio-group
        *ngIf="activeSelector === 'workoutType'"
        id="workout-type-options"
        class="setup-choice-group"
        [(ngModel)]="workoutType"
        (ionChange)="closeSelector()"
      >
        <ion-radio
          *ngFor="let option of workoutTypeOptions"
          class="setup-choice"
          [value]="option.value"
          labelPlacement="end"
        >
          {{ option.label }}
        </ion-radio>
      </ion-radio-group>

      <button
        type="button"
        class="setup-selector-row"
        [class.is-expanded]="activeSelector === 'duration'"
        [attr.aria-expanded]="activeSelector === 'duration'"
        aria-controls="duration-options"
        (click)="toggleSelector('duration')"
      >
        <span class="setup-option__icon" aria-hidden="true">
          <ion-icon name="time-outline"></ion-icon>
        </span>
        <span class="setup-selector-copy">
          <span>Duration</span>
          <strong>{{ durationLabel }}</strong>
        </span>
        <ion-icon class="setup-selector-chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
      </button>

      <ion-radio-group
        *ngIf="activeSelector === 'duration'"
        id="duration-options"
        class="setup-choice-group"
        [(ngModel)]="durationMinutes"
        (ionChange)="closeSelector()"
      >
        <ion-radio
          *ngFor="let option of durationOptions"
          class="setup-choice"
          [value]="option.value"
          labelPlacement="end"
        >
          {{ option.label }}
        </ion-radio>
      </ion-radio-group>

      <div class="setup-option setup-option--static">
        <div class="setup-option__icon" aria-hidden="true">
          <ion-icon name="heart-outline"></ion-icon>
        </div>
        <div>
          <span>Coaching style</span>
          <strong>{{ coachingTone || 'Choose in onboarding' }}</strong>
        </div>
      </div>

      <div class="setup-option setup-option--static">
        <div class="setup-option__icon" aria-hidden="true">
          <ion-icon name="sparkles-outline"></ion-icon>
        </div>
        <div>
          <span>Today’s intention</span>
          <strong>{{ mainGoal || 'Choose in onboarding' }}</strong>
        </div>
      </div>
    </section>

    <ion-button class="start-workout" expand="block" [disabled]="!canContinue" (click)="continue()">
      Begin workout
      <ion-icon name="arrow-forward" slot="end" aria-hidden="true"></ion-icon>
    </ion-button>
  </main>
</ion-content>
