<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Workout Setup</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <h1>Workout Setup</h1>
  <p>Choose the basics for this workout.</p>

  <ion-list>
    <ion-list-header>
      <ion-label>Workout type</ion-label>
    </ion-list-header>
    <ion-radio-group name="workoutType" [(ngModel)]="workoutType">
      <ion-item *ngFor="let option of workoutTypeOptions">
        <ion-radio [value]="option.value" labelPlacement="end">{{ option.label }}</ion-radio>
      </ion-item>
    </ion-radio-group>
  </ion-list>

  <ion-list>
    <ion-list-header>
      <ion-label>Duration</ion-label>
    </ion-list-header>
    <ion-radio-group name="durationMinutes" [(ngModel)]="durationMinutes">
      <ion-item *ngFor="let option of durationOptions">
        <ion-radio [value]="option.value" labelPlacement="end">{{ option.label }}</ion-radio>
      </ion-item>
    </ion-radio-group>
  </ion-list>

  <ion-list>
    <ion-list-header>
      <ion-label>From onboarding</ion-label>
    </ion-list-header>
    <ion-item>
      <ion-label>
        <h2>Coaching tone</h2>
        <p>{{ coachingTone || 'Not set yet' }}</p>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-label>
        <h2>Main goal</h2>
        <p>{{ mainGoal || 'Not set yet' }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-button expand="block" [disabled]="!canContinue" (click)="continue()">Continue</ion-button>
</ion-content>
