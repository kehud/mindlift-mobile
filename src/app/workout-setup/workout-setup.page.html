<ion-content [fullscreen]="true" class="setup-content">
  <button
    slot="fixed"
    type="button"
    class="setup-close"
    aria-label="Close workout setup"
    (click)="closeSetup()"
  >
    <ion-icon name="close-outline" aria-hidden="true"></ion-icon>
  </button>

  <main class="setup-shell">
    <section class="setup-intro" aria-labelledby="setup-title">
      <p class="eyebrow">MAKE IT YOURS</p>
      <h1 id="setup-title">Set up your workout.</h1>
      <p>A few small choices help us guide the session.</p>
    </section>

    <section class="setup-form" aria-label="Workout preferences">
      <button
        type="button"
        class="setup-selector-row"
        (click)="openSheet('workoutType')"
      >
        <span class="setup-option__icon" aria-hidden="true">
          <ion-icon name="barbell-outline"></ion-icon>
        </span>
        <span class="setup-selector-copy">
          <span>Focus area</span>
          <strong>{{ workoutTypeLabel }}</strong>
        </span>
        <ion-icon class="setup-selector-chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
      </button>

      <button
        type="button"
        class="setup-selector-row"
        (click)="openSheet('duration')"
      >
        <span class="setup-option__icon" aria-hidden="true">
          <ion-icon name="time-outline"></ion-icon>
        </span>
        <span class="setup-selector-copy">
          <span>Duration</span>
          <strong>{{ durationLabel }}</strong>
        </span>
        <ion-icon class="setup-selector-chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
      </button>

      <button type="button" class="setup-selector-row" (click)="openSheet('coachingTone')">
        <span class="setup-option__icon" aria-hidden="true">
          <ion-icon name="heart-outline"></ion-icon>
        </span>
        <span class="setup-selector-copy">
          <span>Coaching style</span>
          <strong>{{ coachingToneLabel }}</strong>
        </span>
        <ion-icon class="setup-selector-chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
      </button>

      <button type="button" class="setup-selector-row" (click)="openSheet('mainGoal')">
        <span class="setup-option__icon" aria-hidden="true">
          <ion-icon name="sparkles-outline"></ion-icon>
        </span>
        <span class="setup-selector-copy">
          <span>Today’s intention</span>
          <strong>{{ mainGoalLabel }}</strong>
        </span>
        <ion-icon class="setup-selector-chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
      </button>
    </section>

    <ion-button class="start-workout" expand="block" [disabled]="!canContinue" (click)="continue()">
      Begin workout
      <ion-icon name="arrow-forward" slot="end" aria-hidden="true"></ion-icon>
    </ion-button>
  </main>

  <app-selection-bottom-sheet
    [fieldTitle]="sheetTitle"
    [isOpen]="activeSheet !== null"
    [options]="sheetOptions"
    [selectedValue]="sheetSelectedValue"
    (dismissed)="closeSheet()"
    (optionSelected)="selectSheetOption($event)"
  ></app-selection-bottom-sheet>
</ion-content>
