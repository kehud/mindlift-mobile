<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Active Workout</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <h1>Active Workout</h1>

  <ion-list *ngIf="session">
    <ion-item>
      <ion-label>
        <h2>Workout type</h2>
        <p>{{ session.workoutType }}</p>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-label>
        <h2>Duration</h2>
        <p>{{ session.durationMinutes }} minutes</p>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-label>
        <h2>Coaching tone</h2>
        <p>{{ session.coachingTone }}</p>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-label>
        <h2>Main goal</h2>
        <p>{{ session.mainGoal }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-button expand="block" [disabled]="!session" (click)="finishWorkout()">Finish Workout</ion-button>
</ion-content>
